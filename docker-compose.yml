# Anda on the 1 vCPU / 1 GB VM. Limits total ~544 MB: that only fits while Pulse is stopped
# (see CLAUDE.md). The torrent engine is the big one.
# Caddy in ../proxy reaches us on the "edge" network as anda-api / anda-web / anda-livekit.
# The only published ports are LiveKit's media ports: WebRTC is UDP and can't go through Caddy.
services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      ANDA_SECURE_COOKIE: "true"   # served over HTTPS via Caddy
      ANDA_TRUST_PROXY: "true"     # client IP from X-Forwarded-For, set by Caddy
      GOMEMLIMIT: 64MiB            # Go heap; leaves room for ffmpeg remuxes (~30 MB each)
      ANDA_TORRENT_URL: http://torrent:11470
      ANDA_CACHE_GB: "8"           # finished Library films; least recently watched evicted past this
      # Extra Stremio stream addons (comma-separated base URLs), set in ~/anda/.env on the VM.
      # The built-in open films work without any.
      ANDA_STREAM_ADDONS: ${ANDA_STREAM_ADDONS:-}
      # Stremio subtitle addons (comma-separated base URLs), also in ~/anda/.env. None by default.
      ANDA_SUBTITLE_ADDONS: ${ANDA_SUBTITLE_ADDONS:-}
      # Voice and camera: LiveKit's key and secret are generated into ~/anda/.env by deploy.sh.
      # A relative URL is completed with the page's own host (wss://<host>/livekit, via Caddy).
      ANDA_LIVEKIT_URL: /livekit
      ANDA_LIVEKIT_KEY: ${LIVEKIT_KEY:-}
      ANDA_LIVEKIT_SECRET: ${LIVEKIT_SECRET:-}
    volumes:
      - data:/data                 # SQLite file, films (/data/media) and their HLS (/data/hls)
    networks:
      default: {}                  # to reach the torrent engine
      edge:
        aliases: [anda-api]
    mem_limit: 128m

  web:
    build: ./web
    restart: unless-stopped
    networks:
      edge:
        aliases: [anda-web]
    mem_limit: 32m

  # Stremio's streaming server: downloads torrents on demand and serves files as seekable
  # HTTP streams to the API's ffmpeg. Internal only (default network, no ports).
  torrent:
    image: stremio/server:latest
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=160   # Node 14 doesn't size its heap to the container
    volumes:
      - torrent:/root/.stremio-server          # its own bounded cache (2 GB) and settings
    mem_limit: 256m
    # Downloading is bulk work: under CPU contention it yields to voice (livekit: 2048).
    cpu_shares: 512

  # LiveKit SFU: forwards voice and camera between browsers (never transcodes), with its
  # built-in TURN relay. Signalling on 7880 through Caddy; media straight to the VM.
  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEY:-devkey}: ${LIVEKIT_SECRET:-}"
      GOMEMLIMIT: 96MiB
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"   # ICE over TCP
      - "7882:7882/udp"   # media
      - "3478:3478/udp"   # TURN
    networks:
      edge:
        aliases: [anda-livekit]
    mem_limit: 128m
    # Voice is real time: on the one vCPU it goes first when the torrent engine or an ffmpeg
    # remux is busy (default share is 1024). Only matters under contention.
    cpu_shares: 2048

networks:
  edge:
    external: true

volumes:
  data:
  torrent:
